########################### SERVICES
services:
  ########################### DAINF LABS CLIENT
  lab-ca-dev:
    image: lab-ca-dev
    container_name: lab-ca-dev
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: dev
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - "8614:80"
    labels:
      # Traefik Config
      - "traefik.enable=true"
      - "traefik.http.routers.lab-ca-dev.tls=true"
      - "traefik.http.routers.lab-ca-dev.rule=Host(`lab-ca-dev.app.pb.utfpr.edu.br`)"
      - "traefik.http.routers.lab-ca-dev.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lab-ca-dev.entrypoints=websecure"

    restart: unless-stopped
    networks:
      - web

########################### NETWORKS
networks:
  web:
    external: true
