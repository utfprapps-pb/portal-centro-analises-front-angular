<div [class]="class" #groupContainer>
    <label *ngIf="label" class="form-label bold">{{ label }}</label>

    <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center gap-1">

        <div [ngClass]="vertical 
            ? 'd-flex flex-column gap-2' 
            : 'd-flex flex-column flex-md-row flex-md-wrap gap-1'">
            <div *ngFor="let option of options; let i = index" class="form-check">
                <input 
                    type="checkbox" 
                    [id]="name + '_' + i"
                    [name]="name"
                    [checked]="isOptionSelected(option)"
                    [disabled]="disabled"
                    (change)="onToggleOption(option, $event)"
                    class="form-check-input">
                
                <label [for]="name + '_' + i" class="form-check-label">
                    <ng-container *ngIf="showSymbolInLabel; else standardLabel">
                        {{ option[labelKey] }} ({{ option[valueKey] }})
                    </ng-container>
                    <ng-template #standardLabel>
                        {{ option[labelKey] }}
                    </ng-template>
                </label>
            </div>
        </div>

        <invalid-info #invalid [causes]="invalidCause" class="mt-1 mt-md-0"></invalid-info>

    </div>

</div>
